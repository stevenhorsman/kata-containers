[package]
name = "kata-remote-libvirt"
version = "0.1.0"
edition = "2021"

# This is a standalone project, not part of the main workspace
[workspace]

[dependencies]
# Use the existing protocols crate from kata-containers
protocols = { path = "../../../src/libs/protocols", features = ["async"] }
ttrpc = { version = "0.8", features = ["async"] }
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
async-trait = "0.1"
anyhow = "1"
virt = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
